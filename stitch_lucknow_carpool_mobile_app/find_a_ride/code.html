<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Find A Ride - RideSaathi</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#d3e4fe",
                        "primary-container": "#2563eb",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#dce9ff",
                        "surface-tint": "#0053db",
                        "on-surface-variant": "#434655",
                        "on-secondary-fixed": "#002114",
                        "on-tertiary-fixed": "#2a1700",
                        "outline-variant": "#c3c6d7",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#005137",
                        "secondary-fixed-dim": "#68dba9",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-secondary-container": "#00714e",
                        "surface-dim": "#cbdbf5",
                        "tertiary-container": "#996100",
                        "surface-bright": "#f8f9ff",
                        "background": "#f8f9ff",
                        "primary-fixed": "#dbe1ff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#00174b",
                        "on-secondary": "#ffffff",
                        "on-surface": "#0b1c30",
                        "surface-container-low": "#eff4ff",
                        "surface-variant": "#d3e4fe",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#003ea8",
                        "secondary": "#006c4a",
                        "secondary-fixed": "#85f8c4",
                        "secondary-container": "#82f5c1",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-tertiary-container": "#ffeedd",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#b4c5ff",
                        "surface": "#f8f9ff",
                        "surface-container": "#e5eeff",
                        "outline": "#737686",
                        "on-background": "#0b1c30",
                        "tertiary-fixed": "#ffddb8",
                        "on-primary-container": "#eeefff",
                        "tertiary": "#784b00",
                        "primary": "#004ac6",
                        "inverse-surface": "#213145",
                        "inverse-on-surface": "#eaf1ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "16px",
                        "gutter": "12px",
                        "xs": "8px",
                        "xl": "32px",
                        "lg": "24px",
                        "base": "4px",
                        "md": "16px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-bold": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-bold": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F8FAFC; /* Slate-50 */
        }
    </style>
</head>
<body class="font-sans antialiased text-on-background min-h-screen pb-24 relative overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim docked full-width top-0 bg-surface dark:bg-surface-dim flat no shadows flex justify-between items-center px-container-margin h-16 w-full max-w-[600px] mx-auto z-50 sticky">
<button aria-label="Menu" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:opacity-80 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">RideSaathi</h1>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[600px] mx-auto px-container-margin pt-lg pb-xl">
<div class="mb-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Find a Ride</h2>
<p class="font-body-sm text-body-sm text-outline">Where are you heading today?</p>
</div>
<form class="space-y-md">
<!-- Location Inputs Container -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/30 relative">
<!-- Vertical connecting line -->
<div class="absolute left-[35px] top-[46px] bottom-[46px] w-[2px] bg-surface-container-highest z-0"></div>
<!-- From Field -->
<div class="relative z-10 flex items-center mb-md">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center mr-sm flex-shrink-0 z-10 relative shadow-sm border border-surface-container">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="trip_origin">trip_origin</span>
</div>
<div class="flex-1">
<label class="sr-only" for="from-location">Leaving from</label>
<input class="w-full h-[52px] bg-transparent border-b border-outline-variant/50 focus:border-primary focus:ring-0 px-0 font-body-lg text-body-lg text-on-surface placeholder-outline transition-colors" id="from-location" placeholder="Leaving from..." type="text" value="Hazratganj">
</div>
</div>
<!-- To Field -->
<div class="relative z-10 flex items-center">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center mr-sm flex-shrink-0 z-10 relative shadow-sm border border-surface-container">
<span class="material-symbols-outlined text-secondary text-[20px]" data-icon="location_on">location_on</span>
</div>
<div class="flex-1">
<label class="sr-only" for="to-location">Going to</label>
<input class="w-full h-[52px] bg-transparent border-b border-transparent focus:border-primary focus:ring-0 px-0 font-body-lg text-body-lg text-on-surface placeholder-outline transition-colors" id="to-location" placeholder="Going to..." type="text">
</div>
</div>
</div>
<!-- Date & Time Row -->
<div class="flex space-x-md">
<!-- Date Picker -->
<div class="flex-1 relative">
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-base ml-xs" for="ride-date">Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-outline" data-icon="calendar_today">calendar_today</span>
<input class="w-full h-[52px] pl-10 pr-sm rounded-xl border border-outline-variant/50 bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary/20 font-body-lg text-body-lg text-on-surface outline-none transition-all shadow-sm" id="ride-date" type="date" min="2026-08-15">
</div>
</div>
<!-- Time Picker -->
<div class="flex-1 relative">
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-base ml-xs" for="ride-time">Time</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-outline" data-icon="schedule">schedule</span>
<select class="w-full h-[52px] pl-10 pr-sm rounded-xl border border-outline-variant/50 bg-surface-container-lowest focus:border-primary focus:ring-2 focus:ring-primary/20 font-body-lg text-body-lg text-on-surface outline-none transition-all shadow-sm appearance-none" id="ride-time">
<option value="">Any time</option>
<option value="morning">Morning (06:00 - 11:59)</option>
<option value="afternoon">Afternoon (12:00 - 16:59)</option>
<option value="evening">Evening (17:00 - 20:59)</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 transform -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Seats Counter -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/30">
    <div class="mb-md">
        <label class="block font-headline-md text-headline-md text-on-surface">Who is travelling?</label>
        <span class="font-body-sm text-body-sm text-outline">Select the number of seats you need</span>
    </div>
    <div class="grid grid-cols-2 gap-2 mb-md">
        <button type="button" class="flex items-center justify-center p-md rounded-xl border border-primary bg-primary/10 text-primary font-medium transition-all active:scale-95">
            Just me
        </button>
        <button type="button" class="flex items-center justify-center p-md rounded-xl border border-outline-variant/30 bg-surface-container-low text-on-surface-variant font-medium transition-all hover:bg-surface-container-high active:scale-95">
            Me + 1
        </button>
        <button type="button" class="flex items-center justify-center p-md rounded-xl border border-outline-variant/30 bg-surface-container-low text-on-surface-variant font-medium transition-all hover:bg-surface-container-high active:scale-95">
            Me + 2
        </button>
        <button type="button" class="flex items-center justify-center p-md rounded-xl border border-outline-variant/30 bg-surface-container-low text-on-surface-variant font-medium transition-all hover:bg-surface-container-high active:scale-95">
            Me + 3
        </button>
        <button type="button" class="flex items-center justify-center p-md rounded-xl border border-outline-variant/30 bg-surface-container-low text-on-surface-variant font-medium transition-all hover:bg-surface-container-high active:scale-95">
            Me + 4
        </button>
    </div>
    <div class="pt-sm border-t border-outline-variant/20">
        <p class="text-body-sm font-medium text-on-surface-variant">Total: <span class="text-primary font-bold">1</span> seat needed</p>
    </div>
</div>
<!-- Quick Filters / Chips -->
<div class="pt-sm">
<span class="block font-label-bold text-label-bold text-on-surface-variant mb-sm">Preferences (Optional)</span>
<div class="flex flex-wrap gap-2">
<button class="h-7 px-3 rounded-full bg-[#F1F5F9] border border-outline-variant/30 text-[12px] font-medium text-on-surface-variant hover:bg-surface-container-high transition-colors flex items-center" type="button">
<span class="material-symbols-outlined text-[16px] mr-1" data-icon="ac_unit">ac_unit</span> AC Required
                    </button>
<button class="h-7 px-3 rounded-full bg-[#F1F5F9] border border-outline-variant/30 text-[12px] font-medium text-on-surface-variant hover:bg-surface-container-high transition-colors flex items-center" type="button">
<span class="material-symbols-outlined text-[16px] mr-1" data-icon="smoke_free">smoke_free</span> No Smoking
                    </button>
<button class="h-7 px-3 rounded-full bg-primary/10 border border-primary/30 text-[12px] font-medium text-primary hover:bg-primary/20 transition-colors flex items-center" type="button">
<span class="material-symbols-outlined text-[16px] mr-1" data-icon="female">female</span> Women Only
                    </button>
</div>
</div>
<!-- Sticky CTA Container -->
<div class="fixed bottom-24 left-0 right-0 w-full max-w-[600px] mx-auto px-container-margin z-40">
<button class="w-full min-h-[52px] bg-primary text-on-primary rounded-xl font-headline-md text-headline-md shadow-[0_8px_16px_rgba(37,99,235,0.2)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center" type="submit">
<span class="material-symbols-outlined mr-2" data-icon="search">search</span>
                    Find Rides
                </button>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface-container-lowest dark:bg-inverse-surface docked full-width bottom-0 rounded-t-xl shadow-[0_-4px_12px_rgba(0,0,0,0.1)] border-t border-outline-variant dark:border-none fixed bottom-0 left-0 right-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 max-w-[600px] mx-auto md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors group">
<span class="material-symbols-outlined mb-1 group-active:scale-90 duration-150 ease-in-out" data-icon="home">home</span>
<span class="font-label-bold text-label-bold">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim bg-surface-container-high dark:bg-surface-tint/20 rounded-xl px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors group">
<span class="material-symbols-outlined mb-1 group-active:scale-90 duration-150 ease-in-out" data-icon="search" style="font-variation-settings: 'FILL' 1;">search</span>
<span class="font-label-bold text-label-bold">Find</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors group">
<span class="material-symbols-outlined mb-1 group-active:scale-90 duration-150 ease-in-out" data-icon="add_circle">add_circle</span>
<span class="font-label-bold text-label-bold">Offer</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors group">
<span class="material-symbols-outlined mb-1 group-active:scale-90 duration-150 ease-in-out" data-icon="history">history</span>
<span class="font-label-bold text-label-bold">Activity</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-3 py-1 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors group">
<span class="material-symbols-outlined mb-1 group-active:scale-90 duration-150 ease-in-out" data-icon="person">person</span>
<span class="font-label-bold text-label-bold">Profile</span>
</button>
</nav>
<script>
        // Simple script to set today's date as default
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('ride-date');
            if (dateInput) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.value = today;
                dateInput.min = today;
            }
        });
    </script>


</body></html>

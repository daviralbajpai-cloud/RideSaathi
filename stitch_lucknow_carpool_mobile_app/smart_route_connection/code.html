</section>

</div>

<div class="relative z-10 flex-1 p-md flex flex-col justify-between pointer-events-none">
<!-- Driver Route Chip (Top Left) -->
<div class="self-start bg-surface/90 backdrop-blur-md rounded-full px-4 py-2 shadow-sm border border-outline-variant/20 flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-primary"></div>
<span class="font-label-bold text-label-bold text-on-surface">Your Route</span>
</div>

<img class="w-12 h-12 rounded-full object-cover border-2 border-surface shadow-sm" data-alt="A portrait photo of a friendly young professional woman, smiling warmly. She has dark hair and is wearing a smart casual jacket. The lighting is soft and flattering, creating a welcoming and trustworthy appearance for a carpool app profile." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHX0MI_oRpOEO7Gd33287FAE5n2mK1hRGs8ggQkmEjX0rHifPlfl-ro4UMDtWSLk__xgo3smBq6wDOTh5QPwprk34duiUWo3zWxfFYcIxrgwUtPAr1pltPltqYAzDSnipbPWaJqFDpI4_9OD_lw_0IHQ6G1zNH1jJwIuzZrC1a3gtcqW0Ny59O5poMyA5pShZCFJaAT7mtCrgkbCsFsoZLXQF8aOOai3SqaUNGQVPpTa0mXHsxKJAWBg"/>
